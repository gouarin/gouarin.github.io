projects:
  title: { fr: Projets open source, en: Open-source projects }
  entries:
    - org: Samurai
      position: { fr: Responsable projet, en: Project lead }
      location: https://github.com/hpc-maths/samurai
      dates: { fr: Depuis 2015, en: Since 2015 }
      items:
        - fr: Samurai est une nouvelle génération de structure de données pour les méthodes d’adaptation de maillage.
          en: Samurai is a new generation of data structures for mesh adaptation methods.
        - fr: Cette librairie est écrite en C++ et utilise activement la librairie xtensor.
          en: The library is written in C++ and relies heavily on xtensor.
        - fr: Elle permet à un utilisateur de bénéficier des dernières avancées en adaptation de maillage de manière transparente pour ses simulations numériques.
          en: It lets users benefit from the latest advances in mesh adaptation transparently in their numerical simulations.
        - fr: Samurai est utilisé et développé par des doctorants et post-doctorants du laboratoire.
          en: Samurai is used and developed by PhD students and postdocs of the laboratory.
        - fr: Plusieurs collaborations extérieures sont en train de voir le jour (ONERA, École centrale, ...).
          en: Several external collaborations are emerging (ONERA, École centrale, ...).
    - org: pylbm
      position: { fr: Responsable projet, en: Project lead }
      location: https://github.com/pylbm/pylbm
      dates: { fr: Depuis 2015, en: Since 2015 }
      items:
        - fr: pylbm est un paquet Python permettant de réaliser facilement des simulations numériques par des méthodes de Boltzmann sur réseaux.
          en: pylbm is a Python package for running numerical simulations with lattice Boltzmann methods easily.
        - fr: 'Il s’adresse à différents types de public : des mathématiciens, des physiciens et des informaticiens.'
          en: It is aimed at mathematicians, physicists and computer scientists.
        - fr: 'La force de pylbm est de pouvoir générer du code numérique à partir de mathématiques formelles en fonction de ce que demande l’utilisateur. Différentes sorties sont disponibles : Cython, NumPy ou Loo.py. pylbm supporte MPI avec mpi4py.'
          en: 'The strength of pylbm is to generate numerical code from symbolic mathematics according to what the user asks for. Several back ends are available: Cython, NumPy or Loo.py. pylbm supports MPI through mpi4py.'
        - fr: Ce logiciel est utilisé dans le cadre d’un projet financé par l’ESA (Agence spatiale européenne) en partenariat avec CENAERO, le Von Karman Institute et le laboratoire de mathématiques d’Orsay.
          en: It is used in a project funded by ESA (the European Space Agency) in partnership with CENAERO, the Von Karman Institute and the Orsay mathematics laboratory.
        - fr: Nous observons 300 téléchargements par mois.
          en: We see 300 downloads per month.
    - org: SCoPI
      position: { fr: Responsable projet, en: Project lead }
      location: https://github.com/hpc-maths/scopi
      dates: { fr: Depuis 2019, en: Since 2019 }
      paragraph:
        fr: Le logiciel SCoPI écrit en C++ est conçu pour la simulation de collections de particules en interaction. Il permet la simulation 2D et 3D de particules (de forme régulière convexe), interagissant avec un milieu environnant (obstacles de différents types, mobiles ou non, force de gravité, couplage possible avec un solveur de fluide) ainsi qu’avec d’autres particules (forces inter-particulaires, contacts). Le modèle de contact peut être sec (inélastique, avec ou sans frottement) ou visqueux (modélisation de la force de lubrification dans un fluide visqueux). Les algorithmes utilisés sont implicites et se ramènent, à chaque pas de temps, à la résolution d’un problème convexe contraint.
        en: SCoPI, written in C++, is designed for the simulation of interacting particle collections. It simulates 2D and 3D particles (with convex regular shapes) interacting with their surroundings (obstacles of various kinds, moving or not, gravity, optional coupling with a fluid solver) and with other particles (inter-particle forces, contacts). The contact model can be dry (inelastic, with or without friction) or viscous (modelling lubrication forces in a viscous fluid). The algorithms are implicit and reduce, at each time step, to solving a constrained convex problem.
    - org: xeus-cling
      position: { fr: Développeur principal, en: Lead developer }
      location: https://github.com/jupyter-xeus/xeus-cling
      dates: { fr: Depuis 2017, en: Since 2017 }
      items:
        - fr: Ce projet a été initié pour faciliter l’apprentissage du C++ auprès des étudiants et lors de formations continues.
          en: The project was started to make learning C++ easier for students and in continuing education courses.
        - fr: Il s’utilise via des notebooks Jupyter qui sont maintenant très utilisés pour l’apprentissage et la recherche reproductible.
          en: It runs in Jupyter notebooks, now widely used for teaching and reproducible research.
        - fr: Cette application a été téléchargée plus de 100 000 fois en deux ans et demi.
          en: It was downloaded more than 100,000 times in two and a half years.
    - org: CAFES
      position: { fr: Responsable projet, en: Project lead }
      location: https://github.com/gouarin/cafes
      dates: { fr: Depuis 2015, en: Since 2015 }
      paragraph:
        fr: Le logiciel CAFES (CArtesian Finite Element Solvers) est écrit en C/C++ et est parallélisé à l’aide de MPI. Il s’appuie fortement sur la librairie PETSc pour la gestion des matrices éléments finis et l’utilisation de solveurs. Le but est de pouvoir résoudre un ensemble de problèmes où il est nécessaire d’avoir un solveur sur grille cartésienne, comme les interactions fluide - particules rigides, l’influence des cils sur les écoulements (par exemple les cils bronchiques) ou le déplacement de micro-nageurs dans un fluide visqueux. Dans chacun des cas, un problème sous contraintes est écrit en résolvant plusieurs problèmes de Stokes où l’on a ajouté un second membre prenant en compte les particules, les cils, ... Ce logiciel est utilisé dans le cadre de l’ANR RheoSuNN.
        en: CAFES (CArtesian Finite Element Solvers) is written in C/C++ and parallelised with MPI. It relies heavily on PETSc for finite element matrices and solvers. Its goal is to solve problems that need a solver on a Cartesian grid, such as fluid - rigid particle interactions, the influence of cilia on flows (for example bronchial cilia) or micro-swimmers moving in a viscous fluid. In each case, a constrained problem is written by solving several Stokes problems with a right-hand side that accounts for the particles, the cilia, ... The software is used in the ANR project RheoSuNN.
    - org: GenEO
      position: { fr: Responsable projet, en: Project lead }
      location: https://github.com/gouarin/GenEO
      dates: { fr: Depuis 2018, en: Since 2018 }
      items:
        - fr: GenEO implémente une nouvelle génération de solveurs en décomposition de domaine qui sont efficaces lorsqu’il existe de fortes variations dans la matrice du système linéaire.
          en: GenEO implements a new generation of domain decomposition solvers that remain efficient when the matrix of the linear system varies strongly.
        - fr: Cette librairie est écrite en Python.
          en: The library is written in Python.
        - fr: Plusieurs articles sont en cours de préparation afin de présenter la méthode et ses cas d’usage.
          en: Several papers presenting the method and its use cases are in preparation.
    - org: xtensor-sparse
      position: { fr: Co-responsable projet, en: Project co-lead }
      location: https://github.com/xtensor-stack/xtensor-sparse
      dates: { fr: Depuis 2020, en: Since 2020 }
      items:
        - fr: Cette librairie est écrite en C++ et a pour but de décrire facilement des tenseurs creux à N dimensions.
          en: The library is written in C++ and describes N-dimensional sparse tensors easily.
        - fr: Elle est basée sur la librairie xtensor.
          en: It is built on xtensor.
        - fr: Les développements sont réalisés dans le cadre d’une collaboration avec la société QuantStack.
          en: Development is carried out in collaboration with the company QuantStack.

